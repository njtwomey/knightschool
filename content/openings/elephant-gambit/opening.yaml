name: Elephant Gambit
eco: C40
side: black
level: beginner
summary: >-
  Black answers 1.e4 e5 2.Nf3 with the pawn push ...d5, offering a pawn for quick development and a grip on the centre. It is
  objectively dubious, so play it for fun and to catch unprepared opponents, who can easily go wrong.
tags: [e4, open, gambit]
family: elephant-gambit
lines:
  - exd5-qe2
  - nxe5-qe2
  - nxe5-d4
refutations:
  - bishop-check-blunder
  - knight-left-hanging
  - knight-hops-to-g5
