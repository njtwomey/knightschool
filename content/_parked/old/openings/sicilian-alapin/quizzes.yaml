- id: alapin-c3-idea
  line: 1. e4 c5 2. c3
  prompt: 'What is the point of 2.c3? Name the move it prepares.'
  accept:
    - keywords: [[d4]]
      feedback: Yes. The c3 pawn supports d4, so White can build a pair of centre pawns and recapture on d4 with the c-pawn.
  reveal: 2.c3 prepares d4. If Black takes on d4, White recaptures with the c-pawn and keeps a strong centre.
  examples:
    match: [it prepares d4, so White can play d4, it supports the d4 square]
    miss: [it attacks the queen, it defends the king, to develop the bishop, no idea]
- id: alapin-bb5-pin
  line: 1. e4 c5 2. c3 Nf6 3. e5 Nd5 4. d4 cxd4 5. Nf3 Nc6 6. cxd4 d6 7. Bc4 Nb6 8. Bb5
  prompt: 'Which black piece does the bishop on b5 put under pressure, and why does it matter?'
  accept:
    - keywords: [[c6, nc6, pin], [e5, defend, protect, guard, support]]
      all: true
      feedback: Yes. The knight on c6 guards e5 and d4, so pinning it down helps White win the e5 pawn back.
    - keywords: [[c6, nc6, pin]]
      partial: true
      feedback: Close. Say what the knight on c6 is defending.
  reveal: The knight on c6 defends e5 and d4. Bb5 pressures it, so after ...dxe5 White's knight can take back on e5.
  examples:
    match: [it pins the knight on c6 which guards e5, the knight on c6 defends e5, pressure on Nc6 the defender of e5]
    miss: [it attacks the queen, it takes the centre, no idea, the bishop on c8]
- id: alapin-e5-bishop
  line: 1. e4 c5 2. c3 e6 3. d4 d5 4. e5
  prompt: "What does the pawn on e5 do to Black's bishop on c8?"
  accept:
    - keywords: [[block, lock, bad, passive, restrict, cramp, hem]]
      feedback: Yes. Black's pawns on e6 and d5 stand on the same colour as the bishop, and e5 stops them moving, so the bishop is shut in.
  reveal: The e5 pawn locks Black's pawn chain, so the bishop on c8 is hemmed in behind its own pawns.
  examples:
    match: [it locks the bishop in, it is a bad bishop, the bishop gets blocked behind the pawns]
    miss: [it attacks the bishop, it trades bishops, no idea, it wins a pawn]
