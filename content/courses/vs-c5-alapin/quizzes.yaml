      feedback: Yes. 5.d5 hits the knight on c6, and when it moves, e5 will kick the knight on f6 as well.
  reveal: 5.d5 attacks the knight on c6. Once it moves, e4-e5 chases the other knight, and Black loses a lot of time.
  showMove: d5
  examples:
    match: [d5, push the d pawn to d5, d4-d5]
    miss: [e5, Nc3, develop the knight, no idea]
- id: trapped-knight-f4
  line: 1. e4 c5 2. c3 Nc6 3. d4 cxd4 4. cxd4 g6 5. d5 Ne5
  prompt: 'The knight went to e5. Which pawn move leaves it with no safe square?'
  accept:
