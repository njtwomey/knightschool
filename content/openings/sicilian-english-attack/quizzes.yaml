- id: english-attack-f3
  line: 1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 a6 6. Be3 e5 7. Nb3 Be6 8. f3
  prompt: 'Name the pawn that 8.f3 protects.'
  accept:
    - keywords: [[e4]]
      feedback: Yes. The f3 pawn guards e4, and it also clears the way for the g-pawn to advance.
  reveal: f3 protects the e4 pawn. Black's knight on f6 and bishop on e6 would otherwise pile up on it.
  examples:
    match: [the e4 pawn, it protects e4, guards the pawn on e4]
    miss: [the d4 pawn, it attacks the queen, no idea, the knight on c3]
- id: english-attack-long-castling
  line: 1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 a6 6. Be3 e5 7. Nb3 Be6 8. f3 Be7 9. Qd2 O-O 10. O-O-O
  prompt: 'Why does White castle on the queenside in the English Attack?'
  accept:
    - keywords: [[storm, attack, push, advance, march, g4, g5], [pawn, g4, g5, h4]]
      all: true
      feedback: Yes. With the kings on opposite wings White can push the g- and h-pawns at Black's king without exposing its own.
    - keywords: [[opposite, different]]
      partial: true
      feedback: Close. Say what White does because the kings are on opposite sides.
  reveal: The kings are on opposite wings, so White's g- and h-pawns can charge at Black's king, while the White king sits far away.
  examples:
    match: [to storm Black's king with the pawns, so the g and h pawns can attack the king, to push pawns at the king]
    miss: [to win a pawn, it is safer, no idea, to attack the queen]
- id: english-attack-g5
  line: 1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 a6 6. Be3 e5 7. Nb3 Be6 8. f3 Be7 9. Qd2 O-O 10. O-O-O Nbd7 11. g4 b5 12. g5
  prompt: 'What does the pawn on g5 attack?'
  accept:
    - keywords: [[f6, nf6]]
      feedback: Yes. The pawn attacks the knight on f6, which has few safe squares and cannot easily go back.
  reveal: The g5 pawn attacks the knight on f6. If it moves away, White's attack on the kingside gains speed.
  examples:
    match: [the knight on f6, it hits f6, attacks Nf6]
    miss: [the queen, the bishop on e6, no idea, the pawn on b5]
