- id: ruy-bh5-nxe5
  line: 1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 d6 5. O-O b5 6. Bb3 Bg4 7. h3 Bh5
  prompt: Black keeps the pin on the knight with 7...Bh5. What does White play, and why does it work?
  accept:
    - keywords: [[nxe5, takes e5, take e5, knight takes], [queen, bxf7, f7, check, fork, nxc6]]
      all: true
      feedback: >-
        Yes. 8.Nxe5 leaves the queen. If 8...Bxd1, then 9.Bxf7+ Ke7 10.Nxc6+ forks the king and queen, and White ends
        two pawns up; any other reply loses a pawn and the bishop's pin.
    - keywords: [[nxe5, takes e5, take e5, knight takes]]
      partial: true
      feedback: Right move. Say what happens if Black takes the queen.
  reveal: >-
    8.Nxe5. If Black takes the queen, 9.Bxf7+ Ke7 10.Nxc6+ forks the king and queen and White comes out two pawns up.
    If 8...dxe5, 9.Qxh5 wins a pawn.
  showMove: Nxe5
  examples:
    match:
      [
        nxe5 because bxf7 check then a knight fork wins the queen back,
        knight takes e5 and if the queen is taken bishop takes f7 check,
        nxe5 leaving the queen then bxf7+ and nxc6+,
      ]
    miss: [h3 again, castle, the bishop is pinned]
