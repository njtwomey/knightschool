- id: bishop-first
  line: 1. d4 d5 2. Bf4
  prompt: Why does White play Bf4 before e3?
  accept:
    - keywords: [[bishop, f4, diagonal, c8, h2], [block, bury, shut, outside, trapped, behind]]
      all: true
      feedback: Yes. Once the pawn is on e3 the bishop would be shut in behind it, so it comes out first.
    - keywords: [[block, bury, shut, trapped, outside, behind]]
      feedback: Right. A pawn on e3 would block the bishop in.
  reveal: The bishop wants to be outside the pawn chain. After e3 it would be stuck behind its own pawns.
  examples:
    match:
      [e3 would block in the bishop, the bishop gets out before e3 shuts it in, it would be shut in behind the e3 pawn]
    miss: [to attack the queen, castles, it controls the centre]
- id: nh5-queen
  line: 1. d4 d5 2. Bf4 Nf6 3. e3 Nh5
  prompt: Black's knight attacks the bishop on f4. How does White punish it?
  accept:
    - keywords: [[qxh5, queen, qh5], [h5, knight, take, capture, lose]]
      all: true
      feedback: Yes. The queen sees h5 along the diagonal from d1, so Qxh5 wins the knight.
    - keywords: [[qxh5]]
      feedback: Yes. Qxh5 wins the knight for nothing.
  reveal: With e2 empty, the queen on d1 attacks h5. The knight is undefended, so Qxh5 wins it.
  showMove: Qxh5
  examples:
    match: [Qxh5, the queen takes the knight on h5, the queen captures it on h5 because nothing defends it]
    miss: [take the bishop, move the bishop away, Bxh5]
- id: poisoned-b2-reply
  line: 1. d4 d5 2. Bf4 c5 3. e3 Qb6 4. Nc3 Qxb2
  prompt: Black took the pawn on b2. Which capture with the knight wins a pawn and threatens a fork?
  accept:
    - keywords: [[nxd5, d5]]
      feedback: Yes. Nxd5 threatens Nc7+ forking king and rook, and Rb1 next traps the queen.
  reveal: 5.Nxd5 threatens Nc7+, a fork of the king and the rook on a8, while Rb1 would trap the queen on b2.
  showMove: Nxd5
  examples:
    match: [Nxd5, the knight takes on d5, knight captures d5 threatening Nc7]
    miss: [Nb5, Bxb8, take the queen]
- id: englund-safe-block
  line: 1. d4 e5 2. dxe5 Nc6 3. Nf3 Qe7 4. Bf4 Qb4+
  prompt: Black's queen gives check and also attacks the bishop on f4. Which piece blocks safely on d2?
  accept:
    - keywords: [[bd2]]
      feedback: Yes. Bd2 blocks the check and takes the bishop out of danger at the same time.
    - keywords: [[bishop], [d2]]
      all: true
      feedback: Yes. The bishop blocks on d2, which also rescues it from the queen.
  reveal: Bd2 blocks the check and moves the attacked bishop to safety. Nbd2 or Qd2 would lose material.
  showMove: Bd2
  examples:
    match: [Bd2, bishop to d2, the bishop blocks on d2]
    miss: [Nbd2, Qd2, knight to d2]
- id: bg4-queen
  line: 1. d4 d5 2. Bf4 Nc6 3. e3 Bg4
  prompt: Black's bishop has come to g4. How does White win it?
  accept:
    - keywords: [[qxg4]]
      feedback: Yes. Qxg4 takes the bishop along the d1-g4 diagonal, and nothing guards it.
    - keywords: [[queen], [g4, bishop]]
      all: true
      feedback: Yes. The queen takes on g4, because e2 is empty and the bishop has no defender.
  reveal: After e3 the queen on d1 sees g4 along the diagonal. Nothing defends the bishop, so Qxg4 wins it.
  showMove: Qxg4
  examples:
    match: [Qxg4, the queen takes the bishop on g4, queen captures on g4]
    miss: [play h3, Be2 to block, Nf3]
- id: a3-vs-nb4
  line: 1. d4 d5 2. Bf4 Nc6 3. e3 Nf6 4. Nd2 Bf5 5. c4 e6 6. a3
  prompt: Why does White play a3 here?
  accept:
    - keywords: [[b4, nb4, bb4], [knight, bishop, stop, stops, prevent, prevents, away, square, control, controls]]
      all: true
      feedback: Yes. The pawn on a3 covers b4, so ...Nb4 (hitting c2 with the bishop on f5) and ...Bb4 never come.
    - keywords: [[c2]]
      partial: true
      feedback: Close. It is about c2, but the move works by taking the b4 square from Black's knight.
  reveal: Black's knight wants b4, where with the bishop on f5 it would attack c2. a3 takes that square away, and ...Bb4 too.
  examples:
    match: [it stops Nb4, takes the b4 square from the knight, so the bishop and knight cannot use b4]
    miss: [prepares b4, to attack the queen, it develops a piece]
- id: h3-vs-d6
  line: 1. d4 Nf6 2. Bf4 d6 3. e3 g6 4. h3
  prompt: Why does White spend a move on h3 against this set-up?
  accept:
    - keywords: [[h2], [bishop, retreat, escape, back, square, home]]
      all: true
      feedback: Yes. The bishop gets the h2 square, so it can step back and keep its diagonal.
    - keywords: [[nh5, e5], [bishop, attack, trap]]
      all: true
      feedback: Yes. Now ...Nh5 or ...e5 cannot chase the bishop off its diagonal, because it has h2 to go to.
  reveal: Black's ...d6 prepares ...e5 or ...Nh5 against the bishop on f4. With h3 played the bishop can retreat to h2 and stay on the b8-h2 diagonal.
  examples:
    match: [gives the bishop h2 to retreat to, so the bishop can go back to h2, so Nh5 or e5 cannot chase the bishop]
    miss: [to stop Bg4, prepares g4, to castle kingside]
