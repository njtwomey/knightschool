    miss: [Nf3, f3, Qd4, no idea]
- id: qa4-check-wins-knight
  line: 1. e4 c5 2. c3 Nc6 3. d4 cxd4 4. cxd4 d6 5. d5 Nb4
  prompt: 'The knight ran to b4. How does White win it?'
  accept:
    - keywords: [[qa4, a4]]
      feedback: Yes. Qa4+ gives check and attacks the knight on b4 at the same time.
  reveal: Qa4+ is a double attack on the king and the knight on b4. Black answers the check and the queen takes the knight.
  showMove: Qa4+
