name: Fried Liver Attack
eco: C57
side: white
level: club
summary: >-
  White sacrifices a knight on f7 to drag Black's king into the open, then hunts it with the queen and bishop. It arises
  from the Two Knights Defence (and from other move orders), and Black can avoid it with 5...Na5, which you also learn to meet.
tags: [e4, open]
lines:
  - main-ke6
  - ke8-bxd5
  - na5-bb5
refutations:
  - b5-trap
  - nd4-trap
