- id: bf4-hangs
  line: 1. e4 c6 2. d4 d5 3. exd5 cxd5 4. Bd3 Nc6 5. c3 Qc7 6. Bf4
  prompt: White's bishop just attacked the queen on c7. What should Black play, and why?
  accept:
    - keywords: [[qxf4]]
      feedback: Yes. Qxf4 wins a bishop for nothing, because the bishop on d3 does not protect f4.
    - keywords: [[take, lose], [bishop, f4]]
      all: true
      feedback: Yes. The bishop on f4 is unprotected, so the queen simply takes it.
  reveal: The bishop on f4 is not protected by anything, so 6...Qxf4 wins a whole piece.
  showMove: Qxf4
  examples:
    match: [Qxf4, take the bishop for free, the bishop is hanging so capture it]
    miss: [move the queen away, castle, play Nf6, defend the queen with the bishop]
- id: bxd5-hangs
  line: 1. e4 c6 2. Bc4 d5 3. Bxd5
  prompt: White just took the pawn on d5 with the bishop. How does Black punish it?
  accept:
    - keywords: [[cxd5]]
      feedback: Yes. The c6 pawn was guarding d5, so cxd5 wins the bishop for a pawn.
    - keywords: [[take, recapture], [pawn, c6, bishop]]
      all: true
      feedback: Yes. Taking with the c-pawn wins a whole bishop for a pawn.
  reveal: 3...cxd5 takes the bishop with the c-pawn. White has lost a piece for a pawn.
  showMove: cxd5
  examples:
    match: [cxd5, take the bishop with the c pawn, recapture with the pawn on c6]
    miss: [Nf6, castle, attack the bishop with a knight]
- id: qh5-g6
  line: 1. e4 c6 2. Bc4 d5 3. Bb3 dxe4 4. Qh5
  prompt: White's queen on h5 is aiming at f7. What does Black play to chase it away?
  accept:
    - keywords: [[g6]]
      feedback: Yes. 4...g6 hits the queen with a pawn, and Black gains time for development.
    - keywords: [[e6]]
      partial: true
      feedback: Close. e6 is safe, but g6 attacks the queen and wins time.
  reveal: 4...g6 attacks the queen with a pawn. After 5.Qe5 Nf6 Black develops with tempo and is a pawn up.
  showMove: g6
  examples:
    match: [g6, play g6 to attack the queen, pawn to g6]
    miss: [castle, Nf6, take the bishop]
- id: qe2-mate
  line: 1. e4 c6 2. d4 d5 3. Nc3 dxe4 4. Nxe4 Nd7 5. Qe2
  prompt: White played 5.Qe2. What is the threat if Black develops with 5...Ngf6?
  accept:
    - keywords: [[nd6, d6, mate, checkmate, smothered]]
      feedback: Yes. 6.Nd6 is mate, because the e7 pawn is pinned by the queen and the king has no squares.
  reveal: After 5...Ngf6?? comes 6.Nd6 mate. The e7 pawn is pinned to the king by the queen on e2.
  examples:
    match: [Nd6 mate, knight to d6 is checkmate, smothered mate on d6]
    miss: [Qxe7, it attacks the queen, nothing is wrong]
- id: d4-unguarded
  line: 1. e4 c6 2. Nf3 d5 3. exd5 cxd5 4. d4 Nc6 5. Nc3 Bg4 6. h3 Bxf3 7. Qxf3 e6 8. Bd3
  prompt: White just played 8.Bd3. What can Black win, and why?
  accept:
    - keywords: [[nxd4]]
      feedback: Yes. Nothing guards d4 any more, so 8...Nxd4 wins a pawn.
    - keywords: [[d4], [take, lose, unguarded]]
      all: true
      feedback: Yes. The queen left d1 for f3 and the bishop on d3 blocks the d-file, so the pawn on d4 is free.
  reveal: 8...Nxd4 wins a pawn. The queen on f3 does not guard d4, and the bishop on d3 shuts the d-file.
  showMove: Nxd4
  examples:
    match: [Nxd4, take the pawn on d4, the d4 pawn is unguarded so win it]
    miss: [castle, Nf6, attack the queen with the knight]
- id: qb5-check
  line: 1. e4 c6 2. d4 d5 3. e5 Bf5 4. Bd3 Bxd3 5. Qxd3 e6 6. Nf3 c5 7. dxc5 Bxc5 8. Qb5+
  prompt: White checks on b5. How should Black block the check, and why?
  accept:
    - keywords: [[nd7]]
      feedback: Yes. The knight on d7 blocks the check and guards the bishop on c5.
    - keywords: [[knight], [d7]]
      all: true
      feedback: Yes. From d7 the knight also guards the bishop on c5.
    - keywords: [[nc6, qd7]]
      partial: true
      feedback: That blocks the check, but the bishop on c5 is left unguarded and the queen takes it.
  reveal: 8...Nd7 is the only good block. The queen on b5 attacks the bishop on c5 as well as the king, and only the knight on d7 also guards c5.
  showMove: Nd7
  examples:
    match: [Nd7, block with the knight on d7, knight to d7 so c5 stays guarded]
    miss: [Nc6, Qd7, move the king to f8]
