- id: bishop-first
  line: 1. d4 d5 2. Bf4
  prompt: Why does White play Bf4 before e3?
  accept:
    - keywords: [[bishop, f4, diagonal, c8, h2], [block, bury, shut, e3, outside, trapped]]
      all: true
      feedback: Yes. Once the pawn is on e3 the bishop would be shut in behind it, so it comes out first.
    - keywords: [[block, bury, shut, trapped, outside]]
      feedback: Right. e3 would block the bishop in.
  reveal: The bishop wants to be outside the pawn chain. After e3 it would be stuck behind its own pawns.
  examples:
    match: [e3 would block in the bishop, the bishop gets out before e3 shuts it in, it would be shut in by the e3 pawn]
    miss: [to attack the queen, castles]
