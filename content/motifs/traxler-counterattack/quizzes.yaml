- id: d5-tempo
  line: 1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. Ng5 Bc5 5. Nxf7 Bxf2+ 6. Kf1 Qe7 7. Nxh8
  prompt: 'Black plays 7...d5 as a pawn sacrifice. What does it gain?'
  accept:
