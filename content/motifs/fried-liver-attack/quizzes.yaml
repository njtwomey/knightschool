- id: f7-sacrifice
  line: 1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. Ng5 d5 5. exd5 Nxd5
  prompt: 'White can play 6.Nxf7. What is the idea of the sacrifice?'
  accept:
    - keywords: [[king, f7], [pull, drag, expose, open, force, attack, lure, exposed]]
      all: true
      feedback: Yes. It drags the king out into the open where the queen and bishop can hunt it.
  reveal: After 6...Kxf7 7.Qf3+ the king is exposed and White's queen and bishop attack the pinned knight on d5.
  showMove: Nxf7
  examples:
    match: [it drags the king out into the open, to expose the king, to lure the king forward and attack it]
    miss: [it wins a pawn, it castles, it develops a piece]
- id: pinned-knight
  line: 1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. Ng5 d5 5. exd5 Nxd5 6. Nxf7 Kxf7 7. Qf3+ Ke6
  prompt: 'Why is the black knight on d5 in trouble?'
  accept:
    - keywords: [[pin, pinned], [bishop, c4, king]]
      all: true
      feedback: Yes. The bishop on c4 pins the knight to the king, and the queen and knight attack it.
    - keywords: [[pin, pinned]]
      partial: true
      feedback: Right idea. Say what it is pinned to.
  reveal: The bishop on c4 pins the knight to the king on e6, and White attacks it with the queen and Nc3.
  showMove: Nc3
  examples:
    match: [it is pinned by the bishop, the bishop on c4 pins it to the king, pinned to the king by the bishop]
    miss: [it is hanging, it is trapped, no idea]
- id: na5-avoids
  line: 1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. Ng5 d5 5. exd5 Na5
  prompt: 'Why does 5...Na5 stop the Fried Liver?'
  accept:
    - keywords: [[recapture, take, d5, knight, pin, sacrifice, f7, attack, bishop]]
      feedback: Yes. Black does not put a knight on d5, so there is no pinned knight and Nxf7 no longer works.
  reveal: Black does not recapture on d5. Without a pinned knight on d5, the sacrifice on f7 has no follow-up.
  showMove: Bb5+
  examples:
    match:
      [it attacks the bishop and does not recapture on d5, there is no knight on d5 to pin, it avoids the f7 sacrifice]
    miss: [it castles, it defends e5, no idea]
