name: 'Sicilian: Alapin Variation'
eco: B22
side: white
opening: sicilian-defence
tier: 2
trigger: '1. e4 c5 2. c3'
summary: >-
  2.c3 prepares d4, so White gets a pair of centre pawns whatever Black does and avoids the long theory of the open
  Sicilian. You will learn the plan against Black's five main replies (2...Nc6, 2...d6, 2...e6, 2...d5 and
  2...Nf6) and a short answer to each rarer one.
about:
  idea: >-
    The open Sicilian (2.Nf3 and 3.d4) gives Black lots of counterplay and needs a lot of theory. 2.c3 sidesteps it:
    it prepares d4, so that if Black takes, White recaptures with a pawn and keeps two pawns side by side in the
    centre. The plans are clear and repeat from game to game.
  risks: >-
    The pawn on c3 takes the knight's best square, so White develops a little more slowly, and Black can hit back at
    once with ...d5 or ...Nf6, attacking e4 before d4 is played. White often ends up with an isolated pawn on d4
    (one with no pawns beside it to guard it), which gives active play but can become a target. With good play Black
    equalises.
  suits: >-
    Players who want to meet the Sicilian without learning the long theory of the open lines. It suits anyone who
    likes a clear centre and the same plans from game to game.
plans:
  - Play d4 next move. If Black takes, recapture with the c-pawn and keep pawns on d4 and e4 or e5.
  - Develop the knights and the king's bishop, castle, and only then look for a second centre break.
  - Against 2...Nf6, kick the knight with e5, then use Bc4 and Bb5 to win time while Black untangles.
  - Against 2...Nc6, after 3.d4 cxd4 4.cxd4, if Black does not play ...d5 at once, push d4-d5 and chase the knight.
  - When the c-pawns have been traded and Black's queen sits on d5, Nc3 hits it with gain of time.
  - Against 2...d5, take the pawn, play d4 and Nf3, and do not hit the queen with c4, which drops d4.
  - Against 2...e6, trade on d5 and aim for pressure on the isolated d5 pawn, with a knight blockading on d4.
motifs: [tempo-on-queen, pawn-wedge, isolated-queens-pawn, centre-pawns, pin-absolute]
tags: [e4, semi-open, sicilian]
