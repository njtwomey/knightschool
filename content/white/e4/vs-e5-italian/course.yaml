name: Italian Game
eco: C50
side: white
opening: italian-game
tier: 1
trigger: '1. e4 e5 2. Nf3'
summary: >-
  White aims the bishop at f7, castles early and builds slowly with c3 and d3. This half of the course covers Black's
  2...Nc6 and every third move after it, including the sharp Two Knights, Fried Liver and Traxler lines and the traps.
plans:
  - Bc4 points at f7; castle by move six and keep the pieces protected before attacking.
  - Build with c3 and d3, not an early d4; then Re1, Bb3, h3 and Nbd2-f1-g3 is the middlegame.
  - Do not play Nc3 while Black's knight can take on e4 and ...d5 hits the bishop and knight together.
  - When Black offers a pawn (Rousseau, Traxler) take what is safe, refuse what is not, and keep developing.
  - Take the pawn on e5 only when the move order is safe (Petrov, Latvian), and know why.
  - Against gambits, take the pawn, develop calmly and give the material back only if it helps you.
  - Castle early; keep f2 protected until your king is safe.
  - Do not let a knight reach g4 with a bishop on c5 aiming at f2.
motifs:
