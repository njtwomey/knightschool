- id: nxe5-trap
  line: 1. e4 e5 2. Nf3 Nc6 3. Bc4 Nd4 4. Nxe5
  prompt: White just took the pawn on e5. Why is that a mistake?
  accept:
    - keywords: [[queen, qg5], [fork, attack, two, double, threat, g2, knight]]
      all: true
      feedback: Yes. 4...Qg5 attacks the knight on e5 and the pawn on g2 at once.
    - keywords: [[queen, qg5]]
      feedback: Right idea. The queen comes to g5 and hits both the knight on e5 and the pawn on g2.
  reveal: After 4...Qg5 the queen attacks both the knight on e5 and the pawn on g2, and White cannot save both.
  showMove: Qg5
  examples:
    match: [Black plays Qg5 forking e5 and g2, the queen attacks two things]
    miss: [it develops a piece, no idea, castles]
- id: h3-stops-bg4
  line: 1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. c3 Nf6 5. d3 d6 6. O-O O-O 7. Re1 a6 8. a4 Ba7 9. h3
  prompt: What is 9.h3 for?
  accept:
    - keywords: [[bishop, bg4, g4, pin]]
      feedback: Yes. It stops ...Bg4, which would pin the knight on f3 to the queen.
  reveal: h3 takes the g4 square away from Black's bishop, so the knight on f3 cannot be pinned to the queen.
  examples:
    match: [stops the bishop going to g4, it prevents Bg4 pinning the knight]
    miss: [attacks the king, it opens a file]
