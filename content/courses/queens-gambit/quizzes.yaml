- id: qga-early-e5
  line: 1. d4 d5 2. c4 dxc4 3. Nf3 Nf6 4. e3 e5
  prompt: 'Black has pushed ...e5 and left it undefended. Which capture wins a pawn safely?'
  accept:
    - keywords: [[nxe5, ne5]]
      feedback: Yes. Nxe5 wins the pawn, and the knight can return to c4 for the other pawn too.
    - keywords: [[knight], [e5]]
      all: true
      feedback: Yes. The knight takes the pawn on e5, and the pawn on d4 stays safe because the queen guards it.
    - keywords: [[dxe5, bxc4]]
      partial: true
      feedback: Close. A different capture wins more.
  reveal: 5.Nxe5 wins a pawn and keeps the d4 pawn guarded by the queen. If 5...Nbd7 then 6.Nxc4 wins the second pawn back.
  showMove: Nxe5
  examples:
    match: [Nxe5, the knight takes e5, knight captures on e5]
    miss: [Bxc4, dxe5, castle, no idea]
- id: albin-no-e3
  line: 1. d4 d5 2. c4 e5 3. dxe5 d4
  prompt: 'The pawn on d4 can be attacked by 4.e3. After 4.e3, which Black move wins by force?'
  accept:
    - keywords: [[bb4, b4]]
      feedback: Yes. After 4...Bb4+ 5.Bd2 dxe3 White cannot take the bishop on b4 because of ...exf2+ and ...fxg1=N+.
    - keywords: [[bishop, check]]
      partial: true
      feedback: Close. Say which square the bishop checks from.
  reveal: 4.e3 Bb4+ 5.Bd2 dxe3 6.Bxb4 exf2+ 7.Ke2 fxg1=N+ wins for Black. Play 4.Nf3 instead.
  examples:
    match: [Bb4+, the bishop checks from b4, Bb4 check]
    miss: [Qh4, Nf6, no idea, Nc6]
- id: slav-a4
  line: 1. d4 d5 2. c4 c6 3. Nf3 Nf6 4. Nc3 dxc4 5. a4
  prompt: 'What does 5.a4 stop Black from playing?'
  accept:
    - keywords: [[b5, b-pawn]]
      feedback: Yes. Without ...b5 Black cannot guard the pawn on c4, so White wins it back.
  reveal: 5.a4 stops ...b5. With the pawn on a4, ...b5 would lose a pawn to axb5, so Black cannot hold the c4 pawn.
  examples:
    match: [b5, it stops b5, the pawn push b5]
    miss: [e5, Bf5, it attacks the knight, no idea]
- id: marshall-e4-fork
  line: 1. d4 d5 2. c4 Nf6 3. cxd5 Nxd5 4. Nf3 Bf5 5. Nbd2 e6
  prompt: 'Black has just played ...e6. Which pawn move wins a piece?'
  accept:
    - keywords: [[e4]]
      feedback: Yes. The pawn on e4 attacks the knight on d5 and the bishop on f5 at once, and only one can move away.
    - keywords: [[fork], [knight, bishop, d5, f5]]
      all: true
      partial: true
      feedback: Close. Say which pawn move makes the fork.
  reveal: 6.e4 forks the knight on d5 and the bishop on f5. Nbd2 was played to support exactly this push.
  showMove: e4
  examples:
    match: [e4, e4 forks the knight and bishop, the pawn to e4]
    miss: [Qb3, Nh4, e3, no idea]
- id: slav-qb3-b7
  line: 1. d4 d5 2. c4 c6 3. Nf3 Nf6 4. Nc3 Bf5 5. cxd5 cxd5
  prompt: 'White plays Qb3 next. Which Black pawn does the queen attack, and why is it weak now?'
  accept:
    - keywords: [[b7]]
      feedback: Yes. The bishop has left c8, so nothing guards b7 and Qb3 attacks it.
  reveal: Qb3 attacks b7. With the bishop on f5 instead of c8, b7 has no guard, so Black must spend a move on it.
  showMove: Qb3
  examples:
    match: [b7, the pawn on b7, it hits b7 because the bishop left]
    miss: [d5, the knight, f7, no idea]
- id: albin-e3-safe
  line: 1. d4 d5 2. c4 e5 3. dxe5 d4 4. Nf3 c5
  prompt: 'In the Albin, an early e3 walks into the Lasker Trap. Why is 5.e3 safe in this position?'
  accept:
    - keywords: [[c5], [bishop, bb4, b4, check, block]]
      all: true
      feedback: Yes. The pawn on c5 stands in the bishop's way, so there is no ...Bb4+ and no trap.
    - keywords: [[bb4, b4], [cannot, no, not, blocked]]
      all: true
      feedback: Yes. The pawn on c5 blocks the bishop, so ...Bb4+ is no longer possible.
  reveal: The pawn on c5 blocks the bishop on f8 from reaching b4, so there is no ...Bb4+ and no Lasker Trap. 5.e3 attacks d4 again.
  showMove: e3
  examples:
    match: [the pawn on c5 blocks the bishop, c5 stops Bb4 check, Bb4 is not possible any more]
    miss: [it attacks d4, develops the bishop, no idea, Bb5 check]
