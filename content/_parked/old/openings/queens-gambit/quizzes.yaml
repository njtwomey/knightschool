- id: bg5-pin
  line: 1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. Bg5
  prompt: What does the bishop on g5 do to the knight on f6?
  accept:
    - keywords: [[pin]]
      feedback: Yes. The knight on f6 is pinned to the queen on d8, so it cannot move freely.
    - keywords: [[attack, threaten, hit, target, x-ray, f6, knight]]
      partial: true
      feedback: Close. It does attack the knight, but name what stands behind it.
  reveal: The bishop pins the knight on f6 against the queen on d8. If the knight moves, White's bishop takes the queen.
  examples:
    match: [it pins the knight, the knight is pinned to the queen, pins f6 to the queen]
    miss: [it attacks the king, castles, it defends the pawn on d4, it is developing]
- id: why-e3-accepted
  line: 1. d4 d5 2. c4 dxc4 3. Nf3 Nf6 4. e3
  prompt: What does 4.e3 prepare?
  accept:
    - keywords: [[c4, bxc4], [bishop, bxc4, retake, recapture, regain]]
      all: true
      feedback: Yes. The bishop on f1 can now take back the pawn on c4.
    - keywords: [[bishop, f1]]
      partial: true
      feedback: Close. Name the square the bishop will go to.
  reveal: It opens the bishop on f1. Next move Bxc4 wins the pawn back, so Black cannot keep the extra pawn.
  examples:
    match: [the bishop takes back on c4, Bxc4 regains the pawn, it lets the bishop recapture on c4]
    miss: [it attacks e5, it castles, it defends the knight on f3, it protects d4]
- id: why-a4-slav
  line: 1. d4 d5 2. c4 c6 3. Nf3 Nf6 4. Nc3 dxc4 5. a4
  prompt: What does 5.a4 stop Black from doing?
  accept:
    - keywords: [[b5], [stop, stops, prevent, prevents, prevented, hold, holding, keep, keeping, support]]
      all: true
      feedback: Yes. Without a4, Black plays ...b5 and defends the extra pawn on c4.
    - keywords: [[b5]]
      partial: true
      feedback: Close. Say what ...b5 would have achieved.
  reveal: It stops ...b5. If Black could play ...b5, the pawn on c4 would be safe and White would be a pawn down.
  examples:
    match: [it stops b5, prevents Black playing b5 to keep the pawn, stops the pawn being held with b5]
    miss: [it attacks the bishop, it develops a piece, it protects the knight, it controls the centre]
