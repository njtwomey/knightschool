      feedback: Yes. After 6.f4 every square the knight can reach is covered or blocked by Black's own pawns.
  reveal: 6.f4 hits the knight. The squares it could go to are covered by White or blocked by Black's pawns on d7, f7 and g6.
  showMove: f4
  examples:
