- id: answer-h4
  line: 1. e4 e5 2. f4 exf4 3. Nf3 d6 4. d4 g5 5. h4
  prompt: 'White attacks the g5 pawn with h4. Which pawn move keeps the extra pawn?'
  accept:
    - keywords: [[g4]]
      feedback: Yes. ...g4 kicks the knight, and ...dxe5 wins it if it jumps to e5.
    - keywords: [[gxh4, take]]
      partial: true
      feedback: Taking on h4 opens the h-file for White's rook. There is a better pawn move.
  reveal: 'Play ...g4. It attacks the knight on f3, which has to retreat to g1 because Ne5 loses to ...dxe5.'
  examples:
    match: [g4, push the pawn to g4, play g4 hitting the knight]
    miss: [Nf6, castle, no idea]
- id: why-not-ne5
  line: 1. e4 e5 2. f4 exf4 3. Nf3 d6 4. d4 g5 5. h4 g4
  prompt: 'The knight on f3 is attacked. Why can White not simply play Ne5?'
  accept:
    - keywords: [[dxe5, d6, pawn, take, capture, recapture]]
      feedback: Yes. The d6 pawn takes the knight on e5, so White just loses a piece.
  reveal: The pawn on d6 captures a knight that lands on e5, so White has to retreat to g1.
  examples:
    match: [the d pawn takes it, dxe5 wins the knight, the pawn on d6 captures it]
    miss: [it would be pinned, no idea, the queen guards it]
- id: why-h6
  line: 1. e4 e5 2. f4 exf4 3. Nf3 d6 4. Bc4 h6
  prompt: 'What does 4...h6 stop White from doing?'
  accept:
    - keywords: [[g5, ng5, bg5, f7]]
      feedback: Yes. With the pawn on h6, White cannot put a knight or bishop on g5 to attack f7.
  reveal: The pawn on h6 covers g5, so White cannot land a piece there to attack f7.
  examples:
    match: [it stops Ng5, stops a piece going to g5, it prevents Bg5]
    miss: [it castles, it attacks the bishop, no idea]
