- id: nb5-threat
  line: 1. d4 d5 2. Nc3 Nf6 3. Bf4 e6 4. Nb5
  prompt: What does 4.Nb5 threaten?
  accept:
    - keywords: [[nc7, c7], [fork, king, rook, mate, check]]
      all: true
      feedback: Yes. Nc7+ would check the king and attack the rook on a8 at once.
    - keywords: [[nc7, c7]]
      partial: true
      feedback: You have the square. Say what the knight would do there.
  reveal: The knight threatens Nc7+, a fork of the king and the rook on a8. The bishop on f4 also hits c7.
  showMove: Na6
  examples:
    match: [Nc7 forks the king and rook, it threatens a fork on c7, Nc7+ checks the king and hits the rook]
    miss: [it attacks the queen, it threatens mate on f7, to develop a piece]
- id: be7-mistake
  line: 1. d4 d5 2. Nc3 Nf6 3. Bf4 e6 4. Nb5 Bb4+ 5. c3 Be7
  prompt: Black just played 5...Be7. How does White punish it?
  accept:
    - keywords: [[nxc7, c7], [fork, queen, rook, king, win]]
      all: true
      feedback: Yes. Nxc7+ forks king and rook, and Qxc7 would lose the queen to Bxc7.
    - keywords: [[nxc7, c7]]
      partial: true
      feedback: Right square. Say why it wins material.
  reveal: Nxc7+ forks the king and rook. If the queen takes the knight, Bxc7 wins the queen.
  showMove: Nxc7+
  examples:
    match: [Nxc7+ forking king and rook, capture on c7 with a fork, Nxc7 wins the rook because the queen cannot take]
    miss: [Qa4, a4 to trap the bishop, castle]
- id: bishop-trap
  line: 1. d4 d5 2. Nc3 Nf6 3. Bf4 e6 4. Nb5 Bb4+ 5. c3 Ba5 6. b4 Bb6 7. a4
  prompt: What does 7.a4 threaten?
  accept:
    - keywords: [[a5], [trap, trapped, win, bishop]]
      all: true
      feedback: Yes. After a5 the bishop on b6 has nowhere safe to go.
    - keywords: [[a5]]
      partial: true
      feedback: You have the move. Say what it does to the bishop on b6.
  reveal: a5 would attack the bishop on b6, and its retreat squares are covered, so White would win a piece.
  showMove: a6
  examples:
    match: [a5 traps the bishop, it threatens a5 to win the bishop, the pawn goes to a5 and the bishop is trapped]
    miss: [it threatens mate, castling, it defends the knight on b5]
