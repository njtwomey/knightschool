name: Sicilian Najdorf
eco: B90
side: black
level: club
summary: >-
  The Najdorf is Black's sharpest reply to 1.e4: Black fights for the centre with the c-pawn and keeps a flexible, counter-attacking position. You will learn the set-up with ...a6 and ...e5 or ...e6 against White's four main sixth moves.
