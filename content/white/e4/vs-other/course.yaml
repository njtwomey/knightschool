name: Rare replies to 1.e4
side: white
opening: rare-replies-to-e4
tier: 3
trigger: '1. e4'
summary: >-
  One short answer to each uncommon reply to 1.e4: the Pirc and Modern, Alekhine, Nimzowitsch, Owen and the odd flank
  moves. Each is a plain setup with a plan you can follow once the opponent leaves the book.
plans:
  - Take the centre with e4 and d4, then develop; do not chase pawns or send the queen out early.
  - Against Pirc and Modern play Be3, Qd2, f3 and Bh6, then push the h-pawn.
  - Against Alekhine, Nimzowitsch and Owen develop, castle and keep e4 and d4 protected.
  - Against odd first moves, d4 first; they have not developed a piece, so take the space.
