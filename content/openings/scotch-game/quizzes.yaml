- id: why-c3
  line: 1. e4 e5 2. Nf3 Nc6 3. d4 exd4 4. Nxd4 Bc5 5. Be3 Qf6 6. c3
  prompt: Black has three pieces aiming at the knight on d4. What does 6.c3 do?
  accept:
    - keywords: [[defend, support, protect, guard, cover], [knight, d4]]
      all: true
      feedback: Yes. c3 gives the knight on d4 a third defender, so it cannot be won.
    - keywords: [[defend, support, protect, guard, cover]]
      feedback: Right. It defends the knight on d4.
  reveal: c3 adds a third defender to the knight on d4, matching the three attackers.
  examples:
    match: [it defends the knight, protects d4, supports the knight on d4]
    miss: [it attacks the queen, castles]
- id: horwitz-nb5
  line: 1. e4 e5 2. Nf3 Nc6 3. d4 exd4 4. Nxd4 Qh4 5. Nb5
  prompt: What does 5.Nb5 threaten?
  accept:
    - keywords: [[nxc7, c7], [fork, king, rook, check]]
      all: true
      feedback: Yes. Nxc7+ would check the king and attack the rook on a8 at the same time.
    - keywords: [[nxc7, c7]]
      partial: true
      feedback: You have the square. Say what the knight does there.
  reveal: The knight threatens Nxc7+, forking the king and the rook on a8.
  showMove: Bb4+
  examples:
    match: [Nxc7 forks the king and rook, it threatens a fork on c7, Nxc7+ checks the king and hits the rook]
    miss: [it attacks the queen, it threatens mate on f7, to develop a piece]
- id: ghulam-kassim-pin
  line: 1. e4 e5 2. Nf3 Nc6 3. d4 exd4 4. Nxd4 Nxd4 5. Qxd4 d6 6. Bd3 Nf6 7. O-O Be7 8. Nc3 O-O 9. Bg5
  prompt: What does 9.Bg5 pin, and to what?
  accept:
