# Every idea the openings name (docs/v2/schemas/content.md). One plain sentence each.
- id: f7-weakness
  name: The weak f7 square
  kind: structure
  summary: At the start only the king guards f7 (f2 for White), so it is the first target of an early attack.
  themes: [kingsideAttack]
- id: centre-pawns
  name: Pawns in the centre
  kind: principle
  summary: Pawns on e4 and d4 take space and give the pieces good squares; prepare the second one before pushing it.
- id: castle-early
  name: Castle early
  kind: principle
  summary: Get the king out of the centre before the position opens.
- id: pin
  name: Pin
  kind: tactic
  summary: A piece cannot move without exposing a more valuable piece behind it.
  themes: [pin]
- id: legal-mate
  name: Legal Mate
  kind: tactic
  summary: A queen sacrifice against an early pin, ending with mate by the minor pieces.
  themes: [mate, sacrifice]
- id: bishop-first
  name: The bishop before the pawn
  kind: principle
  summary: Bring the bishop out before a pawn move shuts it in (White's Bf4 before e3, Black's ...Bf5 before ...e6); then the pawn move costs nothing.
- id: attack-the-base
  name: Attack the base of the chain
  kind: plan
  summary: A pawn chain is only as strong as its back pawn; hit that pawn and everything in front of it comes loose.
- id: isolated-queens-pawn
  name: The isolated d-pawn
  kind: structure
  summary: A d-pawn with no neighbours can only be guarded by pieces; put a piece on the square in front of it and swap the rest.
- id: blocked-guard
  name: The blocked guard
  kind: tactic
  summary: A piece that moves in front of a defender cuts it off, and what it was guarding falls.
- id: outpost
  name: Outpost
  kind: structure
  summary: A square near the enemy that no enemy pawn can easily attack, where a knight is strong for a long time.
- id: poisoned-pawn
  name: Poisoned pawn
  kind: tactic
  summary: A pawn that can be taken, but taking it costs more time or material than it wins.
- id: queen-trap
  name: Queen trap
  kind: tactic
  summary: A queen that goes pawn-hunting runs out of safe squares and is lost.
  themes: [trappedPiece]
- id: fork
  name: Fork
  kind: tactic
  summary: One piece attacks two or more targets at once, and only one can be saved.
  themes: [fork]
- id: hanging-piece
  name: Hanging piece
  kind: tactic
  summary: A piece that nobody defends, so it can simply be taken.
  themes: [hangingPiece]
- id: open-file
  name: The open file
  kind: plan
  summary: A rook belongs on a file with no pawns on it, or on one about to open, where it can reach deep into the position.
- id: minority-attack
  name: The minority attack
  kind: plan
  summary: Push two pawns against three on the queenside, so that the trade leaves the bigger group with a weak, backward pawn.
- id: greek-gift
  name: The Greek gift
  kind: tactic
  summary: A bishop takes on h7 with check to drag the castled king out, and a knight on g5 and the queen come in behind it.
  themes: [sacrifice, kingsideAttack]
- id: discovered-attack
  name: Discovered attack
  kind: tactic
  summary: A piece moves out of the way with a threat of its own and uncovers an attack by the piece behind it.
  themes: [discoveredAttack]
- id: trapped-piece
  name: Trapped piece
  kind: tactic
  summary: A piece with no safe square left can be attacked and won.
  themes: [trappedPiece]
- id: remove-the-guard
  name: Remove the guard
  kind: tactic
  summary: Swap off or chase away the piece that guards something, and what it guarded falls.
