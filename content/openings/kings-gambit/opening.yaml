name: King's Gambit
eco: C30
side: white
level: club
summary: >-
  White offers the f-pawn on move two to pull Black's e-pawn away from the centre, then builds a big centre and goes for
  the attack. It is risky and the engine rates it slightly worse for White, so play it for fun and to catch unprepared
  opponents.
