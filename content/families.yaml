# The openings that courses are grouped under. A course joins one with `family:` in its opening.yaml; a course with
# `against:` must name a family described here. Courses with no family stand alone, so this file only needs the openings
# that have more than one course, but listing them all lets us write a proper summary and defining moves.
- id: caro-kann
  name: Caro-Kann Defence
  eco: B10-B19
  summary: >-
    A solid defence to 1.e4: Black plays ...c6 and ...d5, and the light-squared bishop gets out before ...e6. Learn to play
    it as Black, and the best systems for White against it.
  moves: 1. e4 c6
- id: italian-game
  name: Italian Game
  eco: C50-C59
  summary: >-
    Knights and the king's bishop out fast, aiming at f7. Quiet ideas like c3 and d3 keep the centre solid while the rest of
    the pieces come out.
  moves: 1. e4 e5 2. Nf3 Nc6 3. Bc4
- id: scotch-game
  name: Scotch Game
  eco: C44-C45
  summary: White opens the centre at once with d4 on move three, so pieces get active squares quickly.
  moves: 1. e4 e5 2. Nf3 Nc6 3. d4
- id: london-system
  name: London System
  eco: D02
  summary: >-
    The same solid set-up against almost anything (d4, Bf4, e3, c3 and a pawn chain), with plans that barely change.
  moves: 1. d4 d5 2. Bf4
- id: scandinavian-defence
  name: Scandinavian Defence
  eco: B01
  summary: Black challenges e4 at once and takes back with the queen, which then has to find a safe square.
  moves: 1. e4 d5 2. exd5 Qxd5
- id: queens-gambit
  name: Queen's Gambit
  eco: D06-D69
  summary: >-
    1.d4 d5 2.c4: White offers a pawn to pull Black's d-pawn away from the centre. Learn it as White, and the sound ways
    for Black to meet it: the Declined, the Accepted, the Slav and the Semi-Slav.
  moves: 1. d4 d5 2. c4
- id: sicilian-defence
  name: Sicilian Defence
  eco: B20-B99
  summary: >-
    Black's most popular reply to 1.e4: ...c5 fights for the centre from the side and leads to sharp, unbalanced games.
    Learn the Najdorf as Black, and the English Attack and the Alapin as White.
  moves: 1. e4 c5
- id: kings-gambit
  name: King's Gambit
  eco: C30-C39
  summary: >-
    White offers the f-pawn on move two for quick development and an open f-file. Exciting and risky: learn to play it as
    White, and a sound way to meet it as Black.
  moves: 1. e4 e5 2. f4
- id: elephant-gambit
  name: Elephant Gambit
  eco: C40
  summary: >-
    Black strikes back with ...d5 on move two, giving up a pawn for activity. A trap-filled gambit for catching an
    unprepared opponent.
  moves: 1. e4 e5 2. Nf3 d5
- id: englund-gambit
  name: Englund Gambit
  eco: A40
  summary: >-
    Black answers 1.d4 with ...e5, a sharp gambit with several traps if White is careless, and a safer path for White
    if they know it.
  moves: 1. d4 e5
- id: kings-indian-defence
  name: King's Indian Defence
  eco: E60-E99
  summary: >-
    Black lets White build a big centre, then attacks it with ...e5 and a kingside pawn storm. Rich in plans, and the
    same set-up works against several White systems.
  moves: 1. d4 Nf6 2. c4 g6
- id: ruy-lopez
  name: Ruy Lopez
  eco: C60-C99
  summary: >-
    White pressures the knight that defends e5 with Bb5. One of the oldest and most respected openings, with a plan for
    nearly every Black reply.
  moves: 1. e4 e5 2. Nf3 Nc6 3. Bb5
- id: french-defence
  name: French Defence
  eco: C00-C19
  summary: >-
    Black plays ...e6 and ...d5, building a solid chain and then attacking White's centre. Learn the best answers to
    White's four main systems.
  moves: 1. e4 e6
