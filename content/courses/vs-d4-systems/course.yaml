name: Against queen's-pawn systems
eco: D00
side: black
opening: d4-systems
tier: 2
trigger: '1. d4 d5'
summary: >-
  What to play when White starts 1.d4 but does not play 2.c4: the Colle and Stonewall with e3, the bishop on g5 or
  the Torre, the Veresov, the Blackmar-Diemer Gambit and the quiet fianchetto setups. The same setup (knights out,
  ...e6, ...c5, a bishop on d6 or e7, castle) works against all of them.
about:
  idea: >-
    These systems let White play the same moves every game without learning theory, so Black answers in kind: one
    setup, with an early ...c5 so that the centre is contested before White's plan gets going. Most of them aim for
    a slow kingside attack, and hitting d4 first gives White something to defend instead.
  risks: >-
    If Black castles and then waits, the Colle and the Stonewall aim a bishop from d3 at h7 and a knight at e5, and
    a bishop sacrifice on h7 can follow. The Blackmar-Diemer Gambit (2.e4) gives White open lines for a pawn, so
    Black must develop before grabbing more. Against a bishop on g5, ...Qb6 only works if taking on b2 is really
    safe.
  suits: >-
    Players who face quiet 1.d4 systems and want one setup instead of a list of answers. It suits a patient player
    who is happy to wait for the right moment for ...c5.
plans:
  - Meet quiet systems with ...Nf6, ...e6, ...c5 and ...Nc6, then castle by move eight.
  - Hit d4 early with ...c5 and ...Nc6, before White gets e4 in.
  - When White's bishop is out on g5, play ...h6 and ...Qb6; the queen attacks b2 and White must spend a move on it.
  - Against the Blackmar-Diemer Gambit take the pawns, develop calmly and castle.
  - Do not push ...g5 or ...e5 to chase a bishop; it loses a pawn and opens lines against your king.
motifs: [attack-the-base, develop-first, give-back-material, tempo-on-queen, poisoned-pawn]
tags: [d4, queens-pawn, systems]
