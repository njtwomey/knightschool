name: Traxler Counterattack
eco: C57
side: black
level: club
summary: >-
  A wild reply in the Two Knights Defence: after 4.Ng5 Black plays 4...Bc5, giving up a bishop to drag White's king into
  the open. It is objectively dubious, but it is packed with traps and teaches piece activity and what an exposed king has to survive.
tags: [e4, open]
lines:
  - nxf7-ke3
  - nxf7-kg1
  - nxf7-kf1
  - bxf7-ke7
  - castles-d5
refutations:
  - ke1-trap
  - qf1-trap
  - bxd5-bg4-trap
  - c3-bg4-trap
