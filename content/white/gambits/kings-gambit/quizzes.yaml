- id: why-not-fxe5
  line: 1. e4 e5 2. f4 Bc5 3. fxe5
  prompt: White just took the pawn on e5. Why is that a mistake?
  accept:
    - keywords: [[qh4, queen, check], [fork, e4, rook, h1, attack, win, lose]]
      all: true
      feedback: Yes. 3...Qh4+ and after g3 the queen takes e4 with check and then h1.
    - keywords: [[qh4, queen, check]]
      partial: true
      feedback: Right idea. Say what the queen wins.
  reveal: After 3...Qh4+ 4.g3 Qxe4+ the queen forks the king and the rook on h1.
  showMove: Qh4+
  examples:
    match:
      [
        Qh4 check then the queen forks king and rook,
        the queen checks on h4 and wins the rook on h1,
        Qh4 then Qxe4 attacks the rook,
      ]
    miss: [it develops a piece, no idea, castles, takes a pawn]
